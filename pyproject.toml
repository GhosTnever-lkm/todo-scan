[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-scan"
version = "0.1.3"
description = "Find TODO/FIXME markers in a repository and fail CI on blocking or unowned ones."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
todo-scan = "todo_scan.cli:main"
